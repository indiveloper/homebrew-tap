name: Validate cask

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v5

      - name: Audit and style
        run: |
          brew tap indiveloper/tap "$GITHUB_WORKSPACE"
          brew trust indiveloper/tap
          brew audit --cask indiveloper/tap/waindow
          brew style --cask indiveloper/tap/waindow

      - name: Install and inspect
        run: |
          brew install --cask indiveloper/tap/waindow
          test -d /Applications/Waindow.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Waindow.app/Contents/Info.plist)" = "1.4.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/Waindow.app/Contents/Info.plist)" = "com.waindow.Waindow"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' /Applications/Waindow.app/Contents/Info.plist)" = "13.1"
          codesign --verify --deep --strict --verbose=2 /Applications/Waindow.app

      - name: Uninstall without touching user data
        if: always()
        run: |
          brew uninstall --cask waindow || true
          test ! -e /Applications/Waindow.app
